<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- الخلفية الدائرية -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  
  <!-- الخلفية -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- دائرة زخرفية خلفية -->
  <circle cx="256" cy="256" r="180" fill="rgba(255,255,255,0.08)"/>
  
  <!-- كرة القدم -->
  <circle cx="256" cy="256" r="140" fill="url(#ballGrad)" stroke="#1a237e" stroke-width="6"/>
  
  <!-- المضلع المركزي (الشكل الخماسي الأوسط) -->
  <polygon points="256,196 296,225 281,272 231,272 216,225" fill="#1a237e"/>
  
  <!-- الأشكال الخماسية المحيطة -->
  <!-- الأعلى -->
  <polygon points="256,110 280,128 270,155 242,155 232,128" fill="#1a237e"/>
  <!-- يمين أعلى -->
  <polygon points="360,160 385,175 380,205 350,205 345,178" fill="#1a237e"/>
  <!-- يمين أسفل -->
  <polygon points="370,300 395,320 385,350 355,345 350,318" fill="#1a237e"/>
  <!-- الأسفل -->
  <polygon points="256,395 285,380 290,405 265,420 240,405" fill="#1a237e"/>
  <!-- يسار أسفل -->
  <polygon points="142,300 170,295 175,325 155,345 130,320" fill="#1a237e"/>
  <!-- يسار أعلى -->
  <polygon points="152,160 180,155 185,185 165,205 135,175" fill="#1a237e"/>
  
  <!-- خطوط ربط -->
  <line x1="256" y1="196" x2="256" y2="155" stroke="#1a237e" stroke-width="5"/>
  <line x1="296" y1="225" x2="345" y2="205" stroke="#1a237e" stroke-width="5"/>
  <line x1="281" y1="272" x2="350" y2="318" stroke="#1a237e" stroke-width="5"/>
  <line x1="231" y1="272" x2="175" y2="325" stroke="#1a237e" stroke-width="5"/>
  <line x1="216" y1="225" x2="185" y2="185" stroke="#1a237e" stroke-width="5"/>
  
  <!-- ساعة صغيرة (رمز تنظيم الوقت) -->
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="45" fill="#fdd835" stroke="#1a237e" stroke-width="5"/>
    <circle cx="0" cy="0" r="38" fill="#fff9c4"/>
    <!-- عقرب الساعات -->
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#1a237e" stroke-width="5" stroke-linecap="round"/>
    <!-- عقرب الدقائق -->
    <line x1="0" y1="0" x2="18" y2="8" stroke="#1a237e" stroke-width="4" stroke-linecap="round"/>
    <!-- النقطة المركزية -->
    <circle cx="0" cy="0" r="5" fill="#e53935"/>
    <!-- علامات الساعة -->
    <circle cx="0" cy="-32" r="2.5" fill="#1a237e"/>
    <circle cx="32" cy="0" r="2.5" fill="#1a237e"/>
    <circle cx="0" cy="32" r="2.5" fill="#1a237e"/>
    <circle cx="-32" cy="0" r="2.5" fill="#1a237e"/>
  </g>
  
  <!-- لمعان على الكرة -->
  <ellipse cx="210" cy="200" rx="40" ry="25" fill="rgba(255,255,255,0.4)" transform="rotate(-30 210 200)"/>
</svg>